[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logvalue"
version = "0.1.0"
description = "Measure the diagnostic value of log templates against labelled failures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DG" }]
dependencies = ["scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
logvalue = "logvalue.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
